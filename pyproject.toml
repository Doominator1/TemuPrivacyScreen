[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temuprivacyscreen"
version = "0.1.0"
description = "On-device gaze-triggered privacy screen for macOS."
requires-python = ">=3.10"
dependencies = [
    "uniface[cpu]>=4.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["temuprivacyscreen*"]

[project.scripts]
temuprivacyscreen = "temuprivacyscreen.__main__:main"
